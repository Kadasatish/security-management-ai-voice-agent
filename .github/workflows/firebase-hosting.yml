name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy Hosting and Firestore Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SECURITY_AI_CALLING_AGENT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only hosting,firestore:rules --project security-ai-calling-agent --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
